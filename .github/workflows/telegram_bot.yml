name: Telegram Bot – Lligueta de 2a Divisió

on:
  # Prèvia automàtica: divendres a les 19:00 UTC (21:00 CEST), abans de la jornada
  schedule:
    - cron: "0 19 * * 5"   # previa
    - cron: "0 22 * * 0"   # postjornada: diumenge a les 22:00 UTC (mitjanit CEST)
  # Llançament manual amb selecció de mode i jornada
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: previa o postjornada"
        required: true
        default: "previa"
        type: choice
        options:
          - previa
          - postjornada
      round_number:
        description: "Número de jornada (buit = detecció automàtica)"
        required: false
        default: ""

jobs:
  send-message:
    name: Enviar missatge (${{ github.event.inputs.mode || 'scheduled' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·lar dependències
        run: pip install -r bot/requirements.txt

      - name: Executar el bot (prèvia – cron divendres)
        if: github.event_name == 'schedule' && github.event.schedule == '0 19 * * 5'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_MODE: previa
        run: python bot/bot.py

      - name: Executar el bot (post-jornada – cron diumenge)
        if: github.event_name == 'schedule' && github.event.schedule == '0 22 * * 0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_MODE: postjornada
        run: python bot/bot.py

      - name: Executar el bot (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_MODE: ${{ github.event.inputs.mode }}
          ROUND_NUMBER: ${{ github.event.inputs.round_number }}
        run: python bot/bot.py

