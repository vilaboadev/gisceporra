name: Telegram Bot – Lligueta de 2a Divisió

on:
  # Execució diària: el bot detecta automàticament si cal enviar prèvia o post-jornada.
  # Robust a jornades intersetmanals: comprova cada dia i usa safeguard contra duplicats.
  schedule:
    - cron: "0 10 * * *"   # cada dia a les 10:00 UTC (12:00 CEST)
  # Llançament manual (per testing o recuperació)
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: auto (detecció), previa o postjornada"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - previa
          - postjornada
      round_number:
        description: "Número de jornada (buit = detecció automàtica)"
        required: false
        default: ""
      force:
        description: "Forçar enviament ignorant el safeguard de duplicats"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  send-message:
    name: Enviar missatge bot lligueta
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·lar dependències
        run: pip install -r bot/requirements.txt

      - name: Executar el bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # En cron automàtic sempre mode "auto"; en manual usa el valor triat
          BOT_MODE: ${{ github.event.inputs.mode || 'auto' }}
          ROUND_NUMBER: ${{ github.event.inputs.round_number || '' }}
          FORCE_SEND: ${{ github.event.inputs.force || 'false' }}
        run: python bot/bot.py

